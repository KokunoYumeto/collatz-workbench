name: Collatz all-even template source control

'on':
  pull_request:
    paths:
      - 'collatz_reconstruction/research_program/all_even_join_extension_20260916/**'
      - 'collatz_reconstruction/research_program/bilateral_root_bounds_20260916/bilateral_control.py'
      - 'collatz_reconstruction/research_program/intrinsic_zero_firstjet_20260915/**'
      - '.github/workflows/collatz-all-even-join-extension.yml'
  push:
    paths:
      - 'collatz_reconstruction/research_program/all_even_join_extension_20260916/**'
      - 'collatz_reconstruction/research_program/bilateral_root_bounds_20260916/bilateral_control.py'
      - 'collatz_reconstruction/research_program/intrinsic_zero_firstjet_20260915/**'
      - '.github/workflows/collatz-all-even-join-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Replay original first-jet receiver and complete new fixtures
        run: python -B collatz_reconstruction/research_program/all_even_join_extension_20260916/replay.py --predecessor
