name: Collatz intrinsic support and integral first jets

'on':
  pull_request:
    paths:
      - 'collatz_reconstruction/research_program/intrinsic_zero_firstjet_20260915/**'
      - '.github/workflows/collatz-intrinsic-firstjet.yml'
  push:
    paths:
      - 'collatz_reconstruction/research_program/intrinsic_zero_firstjet_20260915/**'
      - '.github/workflows/collatz-intrinsic-firstjet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Replay the unchanged structural predecessor in both modes
        run: |
          python -B collatz_reconstruction/research_program/supported_structure_20260915/verify.py --check collatz_reconstruction/research_program/supported_structure_20260915/verification.json
          python -O -B collatz_reconstruction/research_program/supported_structure_20260915/verify.py --check collatz_reconstruction/research_program/supported_structure_20260915/verification.json
      - name: Verify source identities and both integral first-jet executions
        run: python -B collatz_reconstruction/research_program/intrinsic_zero_firstjet_20260915/replay.py
