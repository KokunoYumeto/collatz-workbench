name: Collatz clocked support and original-source certificate

# Historical complete replay is available on explicit request.
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Retain original sources and replay ten executions
        run: python -B collatz_reconstruction/research_program/clocked_support_20260914/replay.py
