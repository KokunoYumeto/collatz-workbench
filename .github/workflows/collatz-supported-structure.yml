name: Collatz supported-zero structure

'on':
  pull_request:
    paths:
      - 'collatz_reconstruction/research_program/supported_structure_20260915/**'
      - '.github/workflows/collatz-supported-structure.yml'
  push:
    paths:
      - 'collatz_reconstruction/research_program/supported_structure_20260915/**'
      - '.github/workflows/collatz-supported-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check source identities and both structural regressions
        working-directory: collatz_reconstruction/research_program/supported_structure_20260915
        run: |
          sha256sum -c MANIFEST.sha256
          python -B verify.py --check verification.json
          python -O -B verify.py --check verification.json
