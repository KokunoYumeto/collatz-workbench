name: Materialize verified Collatz result files once

'on':
  push:
    branches: ['research/stopped-cycle-cohomology-20260914']
    paths:
      - '.github/workflows/collatz-materialize-once.yml'
      - 'collatz_reconstruction/research_program/stopped_cycle_integration_20260914/materialize_once.py'

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'KokunoYumeto/collatz-workbench' && github.ref == 'refs/heads/research/stopped-cycle-cohomology-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild original result bytes and replay all six checks
        run: python -B collatz_reconstruction/research_program/stopped_cycle_integration_20260914/materialize_once.py
      - name: Commit only the three verified additions on this review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='research/stopped-cycle-cohomology-20260914'
          test "$(git ls-remote --heads origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          old='collatz_reconstruction/research_program/stopped_affine_transport_20260914'
          new='collatz_reconstruction/research_program/cycle_relative_cohomology_20260914'
          git diff --exit-code
          git add -- "$old/verification.json" "$old/example_certificate.json" "$new/verification.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test "$(git diff --cached --name-only --diff-filter=A | wc -l)" -eq 3
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Materialize the three byte-verified Collatz result certificates'
          git push origin "HEAD:refs/heads/$branch"
