name: Collatz bilateral roots and subquadratic original support

'on':
  pull_request:
    paths:
      - 'collatz_reconstruction/research_program/**'
      - '.github/workflows/collatz-bilateral-root-bounds.yml'
  push:
    paths:
      - 'collatz_reconstruction/research_program/bilateral_root_bounds_20260916/**'
      - '.github/workflows/collatz-bilateral-root-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Replay original integral maps and complete source certificates
        run: python -B collatz_reconstruction/research_program/bilateral_root_bounds_20260916/replay.py --full --predecessor
