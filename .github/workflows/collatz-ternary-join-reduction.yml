name: Collatz all-layer joins and source-window proof

'on':
  pull_request:
    paths:
      - 'collatz_reconstruction/research_program/**'
      - '.github/workflows/collatz-ternary-join-reduction.yml'
  push:
    paths:
      - 'collatz_reconstruction/research_program/ternary_join_reduction_20260916/**'
      - '.github/workflows/collatz-ternary-join-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild all original-source certificates and independent audit
        run: python -B collatz_reconstruction/research_program/ternary_join_reduction_20260916/replay.py --full --predecessor
